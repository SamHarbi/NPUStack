  #     - ../ollama_data:/root/.ollama
  #   restart: unless-stopped

  fastflowlm:
    image: localhost:5000/fastflowlm
    build: 
      context: ./fastflowlm/
    container_name: fastflowlm
    network_mode: host
    group_add:
      - keep-groups
    environment:
      - MODEL_1=qwen3.6-moe:35b-a3b
    volumes:
      - ../models:/root/.config/flm    
    devices:
      - "/dev/kfd:/dev/kfd"
      - "/dev/dri:/dev/dri"
      - "/dev/accel/accel0:/dev/accel/accel0"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "52625:52625"
    command: >
      sh -c "
      whoami &&
      flm validate &&
      ls -ld /workspace &&
      echo 'Checking and downloading models...' &&
      flm pull $$MODEL_1 &&
      echo 'All models ready! Starting FastFlowLM server...' &&
      exec flm serve --img-pre-resize 4 --host 0.0.0.0 --port 52625
      "

  open-webui:
    image: ghcr.io/open-webui/open-webui:main-slim
    pull_policy: always
    container_name: open-webui
    network_mode: host
    ports:
      - "8080:8080"
    volumes:
      - ../open_webui_data:/app/backend/data
    environment:
      # Point WebUI to FLM's OpenAI-compatible server
      - OPENAI_API_BASE_URL=http://host.docker.internal:52625/v1
      - OPENAI_API_KEY=dummy-key
    restart: unless-stopped
    depends_on:
      - fastflowlm

  opencode:
    image: ghcr.io/anomalyco/opencode:latest
    container_name: opencode
    restart: unless-stopped
    command: serve --hostname 0.0.0.0 --port 8081
    network_mode: host
    ports:
      - "8081:8081"
    environment:
      - OPENAI_API_BASE_URL=http://host.docker.internal:52625/v1
      - OPENAI_API_KEY=dummy-key
    volumes:
      - ../opencode-config:/root/.config/opencode
      - ../opencode-share:/root/.local/share/opencode

