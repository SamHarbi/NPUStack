<svg xmlns="http://www.w3.org/2000/svg" width="800" height="180" viewBox="0 0 800 180" role="img" aria-labelledby="title">
  <title id="title">NPUStack</title>
  <!-- Two-tone wordmark: NPU (#a46422) + Stack (#eb8931).
       Font: monospace. If monospace is not installed,
       viewers fall back to a generic sans-serif. -->
  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central"
        font-family="'monospace', 'Segoe UI', Arial, sans-serif"
        font-size="110" font-weight="800" letter-spacing="2"><tspan fill="#a46422">|NPU_</tspan><tspan fill="#eb8931">Stack|</tspan></text>
</svg>
