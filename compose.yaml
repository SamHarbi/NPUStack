# NPUStack — single compose entrypoint (PUB-007)
#
# Usage:
#   podman compose up -d            # or: docker compose up -d
#   podman compose --profile registry up -d   # also start the local registry
#
# Profiles:
#   (default)  fastflowlm, open-webui, opencode
#   registry   local container registry (builder workflow only)
#
# Networking parity and secrets/env handling are tracked in PUB-010 and
# PUB-012. The opencode service builds from ./opencode (PUB-025).

networks:
  cross_container:
    driver: bridge
    internal: true

services:
  # I prefer to keep inference purely on the NPU for power efficiency and better overall response when
  # multitasking (CPU / GPU not busy with inference), but if your workflow is different- feel free to spin up ollama here too
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ./data/ollama_data:/root/.ollama
  #   restart: unless-stopped

  fastflowlm:
    image: fastflowlm:latest
    stop_signal: SIGINT
    build:
      context: ./fastflowlm/
    container_name: fastflowlm
    group_add:
      - keep-groups
    volumes:
      - ./data/models:/root/.config/flm
    devices:
      - "/dev/kfd:/dev/kfd"
      - "/dev/dri:/dev/dri"
      - "/dev/accel/accel0:/dev/accel/accel0"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    command: >
      sh -c "
      whoami &&
      flm validate &&
      echo 'Starting FastFlowLM server...' &&
      exec flm serve --img-pre-resize 4 --host 0.0.0.0 --port 52625
      "
    networks:
      - cross_container
    expose:
      - "52625"

  open-webui:
    image: ghcr.io/open-webui/open-webui:main-slim
    pull_policy: always
    container_name: open-webui
    expose:
      - "8080"
    volumes:
      - ./data/open_webui_data:/app/backend/data
    environment:
      # Point WebUI to FLM's OpenAI-compatible server
      - OPENAI_API_BASE_URL=http://fastflowlm:52625/v1
      - OPENAI_API_KEY=dummy-key
    restart: unless-stopped
    depends_on:
      - fastflowlm
    networks:
      - cross_container

  opencode:
    build:
      context: ./opencode/
    image: npustack-opencode-dev:latest
    container_name: opencode
    restart: unless-stopped
    command: serve --hostname 0.0.0.0 --port 8081
    working_dir: /workspace
    expose:
      - "8081"
    environment:
      - OPENAI_API_BASE_URL=http://host.docker.internal:52625/v1
      # TODO(PUB-012): move to .env, do not commit a real key.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-dummy-key}
    volumes:
      - ./workspace:/workspace
      - ./data/opencode-config:/root/.config/opencode
      - ./data/opencode-share:/root/.local/share/opencode
    networks:
      - cross_container

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
      - "${HTTPS_PORT:-8443}:443/udp"
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-http://npu-stack.localhost}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy_data:/data
      - ./data/caddy_config:/config
    networks:
      - cross_container
