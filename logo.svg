<svg xmlns="http://www.w3.org/2000/svg" width="800" height="180" viewBox="0 0 800 180" role="img" aria-labelledby="title">
  <title id="title">NPUStack</title>
  <!-- Two-tone wordmark: NPU (#a46422) + Stack (#eb8931).
       Font: Russo One (Google Fonts). If Russo One is not installed,
       viewers fall back to a generic sans-serif; install Russo One or
       convert the text to paths for a pixel-identical rendering. -->
  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central"
        font-family="'Russo One', 'Segoe UI', Arial, sans-serif"
        font-size="110" font-weight="400" letter-spacing="2"><tspan fill="#a46422">NPU</tspan><tspan fill="#eb8931">Stack</tspan></text>
</svg>
