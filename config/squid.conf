# ---- Listeners ----
# 3080: reverse proxy (published to host)
# 3128: forward proxy (internal network only, NOT published)
http_port 3080 accel vhost name=reverse
http_port 3128 name=forward

acl on_reverse myportname reverse
acl on_forward myportname forward

# ---- Reverse proxy: host-based routing (replaces Caddyfile) ----
acl site_opencode dstdomain npu-stack-opencode.localhost npu-stack-ui.localhost npu-stack.localhost
# acl site_ui       dstdomain npu-stack-ui.localhost

cache_peer opencode  parent 8080 0 no-query originserver name=opencode login=PASSTHRU forceddomain=npu-stack-opencode.localhost
# cache_peer open-webui parent 8080 0 no-query originserver name=openwebui login=PASSTHRU forceddomain=npu-stack-ui.localhost

cache_peer_access opencode  allow site_opencode
cache_peer_access opencode  deny all
# cache_peer_access openwebui allow site_ui
# cache_peer_access openwebui deny all

# ---- Forward proxy: allowlist for fastflowlm egress ----
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT

# Hugging Face (model downloads & Xet storage)
acl fwd_allowed dstdomain .huggingface.co .hf.co

# OpenCode models
acl fwd_allowed dstdomain .opencode.ai .cdn.hf.co

# GitHub (Copilot + git itself)
acl fwd_allowed dstdomain .github.com .githubcopilot.com .githubusercontent.com


# ---- Access rules ----
http_access allow on_reverse site_opencode
# http_access allow on_reverse site_ui

http_access deny on_forward !Safe_ports
http_access deny on_forward CONNECT !SSL_ports
http_access allow on_forward fwd_allowed

http_access deny all

# ---- Behaviour for LLM traffic (streaming / long requests) ----
cache deny all                     # never cache SSE / API responses
cache_mem 8 MB
request_timeout 5 minutes
read_timeout 10 minutes
connect_timeout 30 seconds
forwarded_for on
via off

request_header_access Authorization allow all
server_persistent_connections off

# WebSocket support (needs Squid >= 5.5; ubuntu/squid is 6.x)
http_upgrade_request_protocols websocket allow all

# pid tracked by container
pid_filename none

# ICMP round-trip measurements. NET_RAW is blocked in containers
pinger_enable off

# --------------------------------------------------------------
# This is designed to be a simple, low traffic local proxy.
# That's the top level justification for all below

# These logs don't matter and only add more complexity to the read_only container
access_log stdio:/dev/stdout
cache_log /dev/stderr
cache_store_log none

